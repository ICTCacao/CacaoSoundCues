[package]
name = "cacaosoundcueswin"
version = "5.1.2"
description = "CacaoSoundCues Windows 版（舞台のための、ポン出し音響アプリ）"
authors = ["ICTCacao"]
edition = "2021"
license = "MIT"

[lib]
name = "cacaosoundcueswin_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = "1"
cacaosoundcues-engine = { path = "../../engine" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Power"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# 確認版でも音の読み込み（symphonia・rubato）が遅くならないよう、ライブラリは最適化する
[profile.dev.package."*"]
opt-level = 3
