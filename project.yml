name: CacaoSoundCues
options:
  bundleIdPrefix: com.ictcacao
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  CacaoSoundCuesCore:
    path: Packages/CacaoSoundCuesCore

settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  # 舞台用のポン出し: キーで即再生 + 幕間 BGM などのリスト再生
  CacaoSoundCues:
    type: application
    platform: macOS
    sources:
      - path: CacaoSoundCues
        excludes:
          - "Resources/*.plist"
    dependencies:
      - package: CacaoSoundCuesCore
    info:
      path: CacaoSoundCues/Resources/Info.plist
      properties:
        CFBundleDisplayName: CacaoSoundCues
        CFBundleName: CacaoSoundCues
        CFBundleShortVersionString: "2.2.0"
        CFBundleVersion: "2.2.0"
        LSMinimumSystemVersion: "14.0"
        CFBundleDevelopmentRegion: ja
        CFBundleLocalizations: [ja]
        LSApplicationCategoryType: public.app-category.music
        NSHumanReadableCopyright: "© 2026 ICTCacao"
        CFBundleDocumentTypes:
          - CFBundleTypeName: CacaoSoundCues キューシート
            CFBundleTypeIconFile: CueSheet
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSTypeIsPackage: true
            LSItemContentTypes: [com.ictcacao.ccsc]
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.ictcacao.ccsc
            UTTypeDescription: CacaoSoundCues キューシート
            UTTypeConformsTo: [com.apple.package, public.composite-content]
            UTTypeIconFile: CueSheet
            UTTypeTagSpecification:
              public.filename-extension: [ccsc]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ictcacao.CacaoSoundCues
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

schemes:
  CacaoSoundCues:
    build:
      targets:
        CacaoSoundCues: all
    run:
      config: Debug
